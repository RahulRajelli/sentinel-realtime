[project]
name = "sentinel-realtime"
version = "0.1.0"
description = "Root-cause vs symptom discrimination for UAV telemetry: a realtime detector tier and an evaluation harness for LLM agent judges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Rahul Rajelli" }]
keywords = ["uav", "ardupilot", "mavlink", "llm-agents", "evaluation", "root-cause-analysis"]
# `flightdx` carries the parsers and the seven detectors. It was previously undeclared, so
# `pip install sentinel-realtime` succeeded and then every command failed with "flightdx is not
# installed" -- a package that installs cleanly and cannot do anything is worse than one that
# refuses to install. Declared now that flightdx is published; before that it could only be
# satisfied from the sibling checkout, which is why CI installs `./_flightdx` explicitly.
dependencies = ["pydantic>=2.0", "flightdx>=0.1.0"]

# Trove classifiers. Only ones that are actually true: "Production/Stable" on a project whose own
# write-up says its central claims rest on 3 flights would be the first dishonest line in it.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Monitoring",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/RahulRajelli/sentinel-realtime"
Repository = "https://github.com/RahulRajelli/sentinel-realtime"
Quickstart = "https://github.com/RahulRajelli/sentinel-realtime/blob/main/QUICKSTART.md"
Whitepaper = "https://github.com/RahulRajelli/sentinel-realtime/blob/main/WHITEPAPER.md"
Method = "https://github.com/RahulRajelli/sentinel-realtime/blob/main/docs/METHOD.md"
Issues = "https://github.com/RahulRajelli/sentinel-realtime/issues"

[project.scripts]
sentinel = "sentinel.cli:main"

[project.optional-dependencies]
live = ["pymavlink>=2.4"]
# Judge backends. `agent` was anthropic-only, which stopped matching reality once every measured
# number came from Gemini or an OpenAI-compatible gateway. Install the one you will actually use.
agent = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
