name: tests
on: [push, pull_request]

# Least privilege. Scorecard's Token-Permissions check wants this declared explicitly;
# the job only reads code, so nothing else is granted.
permissions:
  contents: read

jobs:
  offline:
    # The whole judge/score/stats layer runs with no simulator, no network and no API key.
    # That is a design property of the capture/judge split, so CI enforces it.
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA, not tag: a tag can be moved to point at new code,
      # so pinning by tag is trusting whoever can push a tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: RahulRajelli/ardupilot-log-analyzer
          path: _flightdx
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: pip install ./_flightdx
      - run: pytest -q
