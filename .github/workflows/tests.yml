name: tests
on: [push, pull_request]

jobs:
  offline:
    # The whole judge/score/stats layer runs with no simulator, no network and no API key.
    # That is a design property of the capture/judge split, so CI enforces it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RahulRajelli/ardupilot-log-analyzer
          path: _flightdx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic pytest ./_flightdx
      - run: pytest -q
